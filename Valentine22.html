<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>For Mama</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  height:100vh;

  /* perfect background fit */
  background:url("014A7B09-AE7D-4E97-9409-0A3C2D341770.jpeg") center/cover no-repeat;

  display:flex;
  justify-content:center;
  align-items:center;

  font-family:Georgia, serif;
  overflow:hidden;
}

/* soft dark overlay so text is readable (NOT blur) */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.25);
}

/* ---------------- CARD ---------------- */
.card{
  position:relative;
  z-index:2;

  background:rgba(255,255,255,0.95);
  padding:30px 35px;
  border-radius:25px;
  text-align:center;

  box-shadow:0 12px 30px rgba(0,0,0,0.3);
}

.card img{
  width:170px;
  margin-bottom:12px;
}

h1{
  margin:10px 0;
}

p{
  margin:6px 0;
  font-size:18px;
}

/* ---------------- BUTTON ROW ---------------- */
.buttons{
  margin-top:18px;
  display:flex;
  gap:25px;
  justify-content:center;
}

/* ---------------- HEART BUTTON ---------------- */
.heart{
  width:80px;
  height:80px;
  border:none;
  cursor:pointer;
  position:relative;
  background:none;
}

/* heart shape */
.heart::before,
.heart::after{
  content:"";
  position:absolute;
  width:45px;
  height:70px;
  background:var(--color);
  border-radius:45px 45px 0 0;
  top:0;
}

.heart::before{
  left:20px;
  transform:rotate(-45deg);
  transform-origin:0 100%;
}

.heart::after{
  left:0;
  transform:rotate(45deg);
  transform-origin:100% 100%;
}

.heart span{
  position:absolute;
  width:100%;
  text-align:center;
  top:25px;
  font-weight:bold;
  color:white;
  z-index:2;
}

/* colors */
#yes{ --color:#e63946; }
#no{ --color:#888; }

/* ---------------- CONFETTI ---------------- */
.confetti{
  position:fixed;
  top:-10px;
  width:10px;
  height:15px;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
  }
}

/* ---------------- BALLOON ---------------- */
.balloon{
  position:fixed;
  bottom:-120px;
  width:45px;
  height:60px;
  border-radius:50%;
  animation:floatUp linear forwards;
}

@keyframes floatUp{
  to{
    transform:translateY(-120vh);
  }
}
</style>
</head>

<body>

<div class="card" id="card">
  <img src="875F56B1-4316-4036-A03A-B18249CF2615.jpeg">
  <h1>Mama (Dudu)</h1>
  <p>Will you be my Valentine?</p>
  <p>From Sri (Bubu)</p>

  <div class="buttons">
    <button id="yes" class="heart" onclick="accepted()">
      <span>Yes</span>
    </button>

    <button id="no" class="heart" onmouseover="runAway()">
      <span>No</span>
    </button>
  </div>
</div>

<script>
/* ---------------- NO BUTTON RUN AWAY ---------------- */
function runAway(){
  const btn = document.getElementById("no");

  btn.style.position="fixed";

  const x = Math.random()*(window.innerWidth-100);
  const y = Math.random()*(window.innerHeight-100);

  btn.style.left=x+"px";
  btn.style.top=y+"px";
}

/* ---------------- YES CLICK CELEBRATION ---------------- */
function accepted(){

  document.body.innerHTML = `
    <div style="
      background:rgba(255,255,255,0.95);
      padding:60px;
      border-radius:25px;
      text-align:center;
      z-index:2;">
      <h1>Mama, you are my Valentine 💖</h1>
      <p>I love you always.</p>
      <p>Bubu</p>
    </div>
  `;

  launchConfetti();
  launchBalloons();
}

/* confetti */
function launchConfetti(){
  const colors=["#ff4d6d","#ffd60a","#06d6a0","#4cc9f0","#8338ec"];

  for(let i=0;i<120;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration=(Math.random()*2+2)+"s";
    document.body.appendChild(c);
  }
}

/* balloons */
function launchBalloons(){
  const colors=["red","pink","yellow","skyblue","purple","orange"];

  for(let i=0;i<15;i++){
    const b=document.createElement("div");
    b.className="balloon";
    b.style.left=Math.random()*100+"vw";
    b.style.background=colors[Math.floor(Math.random()*colors.length)];
    b.style.animationDuration=(Math.random()*4+5)+"s";
    document.body.appendChild(b);
  }
}
</script>

</body>
</html>
