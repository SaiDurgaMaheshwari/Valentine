<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>For Mama</title>

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: Georgia, serif;
      overflow:hidden;
      position:relative;

      background: center / cover no-repeat fixed;
      background-image: var(--bg);
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.25);
      pointer-events:none;
    }

    .card{
      position:relative;
      z-index:2;
      width:min(92vw, 420px);
      background:rgba(255,255,255,0.94);
      padding:28px 26px;
      border-radius:22px;
      text-align:center;
      box-shadow:0 14px 30px rgba(0,0,0,0.28);
    }

    .card img{
      width:170px;
      height:auto;
      margin-bottom:10px;
      user-select:none;
      -webkit-user-drag:none;
    }

    h1{ margin:8px 0 6px; font-size:28px; }
    p{ margin:8px 0; font-size:18px; }

    .buttons{
      margin-top:18px;
      display:flex;
      justify-content:center;
      gap:18px;
      position:relative;
    }

    .heart-btn{
      width:96px;
      height:84px;
      border:none;
      background:transparent;
      padding:0;
      cursor:pointer;
      position:relative;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
      touch-action: manipulation;
    }

    .heart-shape{
      position:absolute;
      left:50%;
      top:50%;
      width:56px;
      height:56px;
      transform:translate(-50%,-50%) rotate(-45deg);
      background:var(--c);
      border-radius:10px;
      box-shadow:0 10px 18px rgba(0,0,0,0.18);
    }
    .heart-shape::before,
    .heart-shape::after{
      content:"";
      position:absolute;
      width:56px;
      height:56px;
      background:var(--c);
      border-radius:50%;
    }
    .heart-shape::before{ top:-28px; left:0; }
    .heart-shape::after { top:0; left:28px; }

    .heart-label{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      font-weight:700;
      color:#fff;
      font-size:16px;
      text-shadow:0 2px 10px rgba(0,0,0,0.25);
      z-index:2;
    }

    .heart-btn:active .heart-shape{
      transform:translate(-50%,-50%) rotate(-45deg) scale(0.96);
    }

    #no{
      position:relative;
      z-index:3;
    }

    .celebrate{
      position:relative;
      z-index:2;
      width:min(92vw, 520px);
      background:rgba(255,255,255,0.94);
      padding:40px 26px;
      border-radius:22px;
      text-align:center;
      box-shadow:0 14px 30px rgba(0,0,0,0.28);
    }

    .confetti{
      position:fixed;
      top:-12px;
      width:10px;
      height:16px;
      border-radius:2px;
      animation:fall linear forwards;
      z-index:10;
    }
    @keyframes fall{
      to{ transform:translateY(110vh) rotate(720deg); opacity:0.95; }
    }

    .balloon{
      position:fixed;
      bottom:-140px;
      width:46px;
      height:62px;
      border-radius:50% 50% 45% 45%;
      z-index:9;
      animation:floatUp linear forwards;
      box-shadow: inset -8px -10px 0 rgba(0,0,0,0.12);
    }
    .balloon::after{
      content:"";
      position:absolute;
      left:50%;
      bottom:-12px;
      width:2px;
      height:34px;
      background:rgba(0,0,0,0.2);
      transform:translateX(-50%);
    }
    @keyframes floatUp{
      to{ transform:translateY(-120vh) translateX(var(--drift, 0px)); opacity:0.98; }
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <img id="sticker" alt="I Love You">
    <h1>Mama (Dudu)</h1>
    <p>Will you be my Valentine?</p>
    <p>From Sri (Bubu)</p>

    <div class="buttons">
      <button class="heart-btn" id="yes" type="button">
        <div class="heart-shape" style="--c:#e63946"></div>
        <div class="heart-label">Yes</div>
      </button>

      <button class="heart-btn" id="no" type="button">
        <div class="heart-shape" style="--c:#8d99ae"></div>
        <div class="heart-label">No</div>
      </button>
    </div>
  </div>

  <script>
    // ✅ REAL embedded images (single-file)
    const BG_DATA_URI =
      "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAoHBwgHBgoICAoKCgkLDhgQDQwNDh0VFhEYIx8lJCIfIiEmKzcoKR8xJzgmKy8xNTU1GiQ7QDs0Py40NTEBDAwMEA8QHxISHzQrJCs0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NP/AABEIAOEA4QMBIgACEQEDEQH/xAAbAAABBQEBAAAAAAAAAAAAAAAEAAIDBQYBB//EADoQAAIBAwMBBQYEBQMFAAAAAAECAwAEEQUSITEGEyJBUWEHFDKBkaGxI0JSYuEHQ1OC8RUzcpL/xAAZAQADAQEBAAAAAAAAAAAAAAAAAgMBBAX/xAAjEQACAgICAgIDAQAAAAAAAAAAAQIRAyExEkFRBRMiMmFx/9oADAMBAAIRAxEAPwD8rQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//2Q==";

    const STICKER_DATA_URI =
      "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAoHBwgHBgoICAoKCgkLDhgQDQwNDh0VFhEYIx8lJCIfIiEmKzcoKR8xJzgmKy8xNTU1GiQ7QDs0Py40NTEBDAwMEA8QHxISHzQrJCs0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NP/AABEIAOEA4QMBIgACEQEDEQH/xAAbAAABBQEBAAAAAAAAAAAAAAAEAAIDBQYBB//EADoQAAIBAwMBBQYEBQMFAAAAAAECAwAEEQUSITEGEyJBUWEHFDKBkaGxI0JSYuEHQ1OC8RUzcpL/xAAZAQADAQEBAAAAAAAAAAAAAAAAAgMBBAX/xAAjEQACAgICAgIDAQAAAAAAAAAAAQIRAyExEkFRBRMiMmFx/9oADAMBAAIRAxEAPwD8rQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//2Q==";

    // Apply images
    document.documentElement.style.setProperty("--bg", `url('${BG_DATA_URI}')`);
    document.getElementById("sticker").src = STICKER_DATA_URI;

    // Mobile-safe No button (touchstart + click) + desktop hover
    function runAway(e){
      if (e){
        e.preventDefault();
        e.stopPropagation();
      }
      const noBtn = document.getElementById("no");
      noBtn.style.position = "fixed";
      noBtn.style.zIndex = "9999";

      const padding = 16;
      const btnW = noBtn.offsetWidth || 96;
      const btnH = noBtn.offsetHeight || 84;

      const x = Math.random() * (window.innerWidth - btnW - padding*2) + padding;
      const y = Math.random() * (window.innerHeight - btnH - padding*2) + padding;

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
    }

    function accepted(){
      document.body.innerHTML = `
        <div class="celebrate">
          <h1>Mama, you are my Valentine! 💖</h1>
          <p>I love you always.</p>
          <p>- Bubu</p>
          <p style="font-size:18px;margin-top:12px;">🎉🎈✨</p>
        </div>
      `;
      launchConfetti(140);
      launchBalloons(18);
    }

    function launchConfetti(count){
      const colors = ["#e63946","#ffb703","#06d6a0","#4361ee","#ff5d8f","#8338ec"];
      for(let i=0;i<count;i++){
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = Math.random()*100 + "vw";
        piece.style.background = colors[Math.floor(Math.random()*colors.length)];
        piece.style.opacity = (Math.random()*0.4 + 0.6).toFixed(2);
        const duration = Math.random()*2.5 + 2.2;
        piece.style.animationDuration = duration + "s";
        document.body.appendChild(piece);
        setTimeout(()=>piece.remove(), (duration+0.3)*1000);
      }
    }

    function launchBalloons(count){
      const colors = ["#ff4d6d","#ffd60a","#4cc9f0","#80ed99","#b5179e","#f77f00"];
      for(let i=0;i<count;i++){
        const b = document.createElement("div");
        b.className = "balloon";
        b.style.left = Math.random()*100 + "vw";
        b.style.background = colors[Math.floor(Math.random()*colors.length)];
        b.style.setProperty("--drift", (Math.random()*120 - 60).toFixed(0) + "px");
        const duration = Math.random()*4 + 5;
        b.style.animationDuration = duration + "s";
        b.style.animationDelay = (Math.random()*0.8) + "s";
        document.body.appendChild(b);
        setTimeout(()=>b.remove(), (duration+1.5)*1000);
      }
    }

    window.addEventListener("load", () => {
      const yesBtn = document.getElementById("yes");
      const noBtn  = document.getElementById("no");

      yesBtn.addEventListener("click", accepted);
      noBtn.addEventListener("mouseenter", runAway);
      noBtn.addEventListener("touchstart", runAway, { passive:false });
      noBtn.addEventListener("click", runAway);
    });
  </script>
</body>
</html>
